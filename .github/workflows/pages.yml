name: Pages

# Publishes site/ to GitHub Pages with the latest release's factory images and
# an esp-web-tools manifest per board, so the page's flasher installs them.
# release.yml calls this after publishing; a release made with the workflow's
# token would not trigger it on its own.

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp -R site _site
          mkdir -p _site/firmware
          if gh release view --repo "$GITHUB_REPOSITORY" --json tagName,url > release.json 2>/dev/null; then
            gh release download --repo "$GITHUB_REPOSITORY" "$(jq -r .tagName release.json)" \
              --pattern 'scheff-zello-*.bin' --dir _site/firmware
          else
            echo "No release yet; the flasher will say so."
            : > release.json
          fi
          python3 scripts/build-site.py release.json _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
