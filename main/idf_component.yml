dependencies:
  idf: ">=5.5.4"

  espressif/esp_codec_dev: "~1.5"

  # The LVGL UI: MIPI-DSI AMOLED on the P4, SPI LCD on the T-Deck.
  lvgl/lvgl: "~9.3"
  espressif/esp_lvgl_port: "^2.6"

  # T-Deck touch controller.
  espressif/esp_lcd_touch_gt911:
    version: "^1.1"
    rules:
      - if: "target in [esp32s3]"

  # The Zello Channels API transport.
  espressif/esp_websocket_client: "^1.5"

  espressif/esp_wifi_remote:
    version: ">=1.6.1,<2.0"
    rules:
      - if: "target in [esp32p4]"
      - if: "$CONFIG{ZELLO_USE_BADGE_BSP} == 0"

  # LilyGO's ESP-Hosted fork adds esp_hosted_sdio_set_reset_callback(), which we
  # need because the C6 EN line sits on the XL9535 I/O expander, not a GPIO. It
  # is vendored under third_party/ rather than fetched, and must match the
  # ESP-Hosted slave firmware flashed on the C6 (the LilygoBox network-adapter
  # image).
  espressif/esp_hosted:
    override_path: "../third_party/esp_hosted"
    rules:
      - if: "target in [esp32p4]"
      - if: "$CONFIG{ZELLO_USE_BADGE_BSP} == 0"

  # Nicolai Electronics Tanmatsu: badge-bsp drives the display, keyboard
  # (through the CH32 coprocessor), power, radio power and the ES8156 DAC.
  # Wi-Fi rides the Tanmatsu's own ESP-Hosted fork, matching the slave
  # firmware the badge.team launcher keeps on its C6.
  badgeteam/badge-bsp:
    version: "^0.9.9"
    rules:
      - if: "$CONFIG{ZELLO_USE_BADGE_BSP} == 1"
  nicolaielectronics/esp-wifi-remote-tanmatsu:
    version: "^1.4.2"
    rules:
      - if: "$CONFIG{ZELLO_USE_BADGE_BSP} == 1"
