; PlatformIO build for Scheff for Zello (scheff-zello): the LilyGO T-Display-P4
; (following echolink-p4's P4 target), the LilyGO T-Deck and the Seeed Wio
; Tracker L2.
; PlatformIO fetches and manages ESP-IDF itself, so no separate ESP-IDF install
; is needed. Plain `idf.py` against an ESP-IDF v5.5.4+ checkout still works too.
;
; Build with scripts/build-upload-monitor.sh: like camillia-mt and echolink-p4
; it runs pio with a separate core dir (~/.platformio-p4) so this pioarduino
; platform cannot be replaced by the espressif32 versions other projects
; resolve.

[platformio]
src_dir = main
default_envs = tdisplay-p4
boards_dir = boards

; LilyGO T-Display P4 V1.0 (ECO2 silicon, pre rev 3.0).
[env:tdisplay-p4]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board     = tdisplay_p4
framework = espidf

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 1500000

board_build.flash_size    = 16MB
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
board_build.partitions    = partitions.csv

; sdkconfig.pio.defaults fixes the space in the project path, and
; sdkconfig.pio.p4.defaults selects the ECO2 chip revision; see those files.
; ESP-IDF adds sdkconfig.defaults.esp32p4 on its own.
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.pio.defaults;sdkconfig.pio.p4.defaults

; LilyGO T-Deck and T-Deck Plus (ESP32-S3, 16 MB flash, 8 MB octal PSRAM).
; ESP-IDF adds sdkconfig.defaults.esp32s3 on its own.
[env:tdeck]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board     = tdeck
framework = espidf

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

; The S3's USB-Serial/JTAG boots into download mode after esptool's usual
; RTS "hard reset" on macOS (GPIO0 is the trackball click, but the USB reset
; latches download mode regardless), leaving the board looking dead after an
; upload. A watchdog reset re-reads the real strap and boots the firmware.
board_upload.after_reset = watchdog-reset
; And don't let opening the monitor assert DTR/RTS, which is that same
; reset-into-download sequence.
monitor_dtr = 0
monitor_rts = 0

board_build.flash_size    = 16MB
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
board_build.partitions    = partitions.csv

board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.pio.defaults

; Seeed Wio Tracker L2 (ESP32-S3, 16 MB flash, 8 MB octal PSRAM).
; sdkconfig.pio.wio.defaults picks the board over the T-Deck default, and
; ESP-IDF adds sdkconfig.defaults.esp32s3 on its own.
[env:wio-tracker-l2]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board     = wio_tracker_l2
framework = espidf

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

; The same USB-Serial/JTAG reset handling as the T-Deck: see [env:tdeck].
board_upload.after_reset = watchdog-reset
monitor_dtr = 0
monitor_rts = 0

board_build.flash_size    = 16MB
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
board_build.partitions    = partitions.csv

board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.pio.defaults;sdkconfig.pio.wio.defaults
